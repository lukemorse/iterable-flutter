# src: https://gist.github.com/rodydavis/bde9a9a8c2fcdcf3474c0f50248f2e3a

name: Flutter Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Cancel jobs and just run the last one
concurrency:
  group: ${{ github.head_ref }}-build
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'

defaults:
  run:
    # The checkout directory must be named iterable_flutter: Flutter names the Swift package
    # symlink after it, and the repository's own name collides with this plugin's library product.
    working-directory: iterable_flutter/example/

jobs:
  build_ios:
    name: Build iOS
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: iterable_flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: iterable_flutter
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter build appbundle
