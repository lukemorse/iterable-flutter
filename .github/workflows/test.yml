# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Cancel jobs and just run the last one
concurrency:
  group: ${{ github.head_ref }}-unit-test
  cancel-in-progress: true

jobs:
  unit_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        # There are no Dart tests yet (test/ only holds factories), and `flutter test` exits
        # non-zero when it finds none. Run it only once some exist.
        run: |
          if find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No *_test.dart files under test/ - skipping."
          fi
