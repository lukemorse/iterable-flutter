name: iterable_flutter
description: Flutter implementation for iterable.com Cross Channel Marketing Platform
version: 0.7.0
homepage: https://lahaus.com
repository: https://github.com/SpringCare/iterable-flutter
issue_tracker: https://github.com/SpringCare/iterable-flutter/issues
documentation: https://github.com/SpringCare/iterable-flutter#readme

environment:
  sdk: ^3.0.0
  # The iOS Swift package depends on FlutterFramework, which the Flutter tool only generates
  # from 3.44 onwards.
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  lint: 1.6.0

flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' and Android 'package' identifiers should not ordinarily
  # be modified. They are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.lahaus.iterable_flutter
        pluginClass: IterableFlutterPlugin
      ios:
        pluginClass: IterableFlutterPlugin
